<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1A1918" />
		<title>Çevrim dışısınız | Dijital Okur</title>
		<style>
			:root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
			body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #1A1918; color: #F2EFEA; }
			main { max-width: 28rem; padding: 2rem; text-align: center; }
			img { width: 4rem; height: 4rem; margin-bottom: 1rem; }
			h1 { margin: 0 0 0.75rem; font-size: 1.75rem; }
			p { margin: 0 0 1.5rem; color: #CFCBC4; line-height: 1.6; }
			a { display: inline-block; padding: 0.75rem 1rem; border-radius: 0.75rem; background: #D97757; color: #fff; font-weight: 600; text-decoration: none; }
		</style>
	</head>
	<body>
		<main>
			<img src="/favicon.svg" alt="" />
			<h1>İnternet bağlantısı yok</h1>
			<p>Dijital Okur'a yeniden ulaşmak için bağlantınızı kontrol edip tekrar deneyin.</p>
			<a href="/">Yeniden dene</a>
		</main>
	</body>
</html>
